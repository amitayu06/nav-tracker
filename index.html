<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1220">
<title>NAV Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:      #0B1220;
    --navy-2:    #141F35;
    --paper:     #F5F7FA;
    --card:      #FFFFFF;
    --ink:       #101828;
    --sub:       #667085;
    --line:      #E4E7EC;
    --mint:      #15803D;
    --mint-bg:   #E8F5EC;
    --coral:     #C0392B;
    --coral-bg:  #FBEAE8;
    --gold:      #C99A2E;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body{ padding-bottom:48px; }

  header{
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff; padding:22px 20px 26px;
    border-bottom-left-radius:22px; border-bottom-right-radius:22px;
    position:relative; overflow:hidden;
  }
  header::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(120px 90px at 88% -10%, rgba(201,154,46,.35), transparent 70%);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:#9AA7C7; margin:0 0 6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px;
    margin:0 0 14px; letter-spacing:-.01em;
  }
  .statusRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .live{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:#C7D0E8; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#3ED598;
    box-shadow:0 0 0 0 rgba(62,213,152,.6); animation:pulse 2.2s infinite; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(62,213,152,.55); }
    70%{ box-shadow:0 0 0 8px rgba(62,213,152,0); }
    100%{ box-shadow:0 0 0 0 rgba(62,213,152,0); }
  }
  #refreshBtn{
    display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16); color:#fff; font:inherit;
    font-size:12.5px; font-weight:500; padding:7px 12px; border-radius:99px;
    cursor:pointer;
  }
  #refreshBtn:active{ background:rgba(255,255,255,.16); }
  #refreshBtn svg{ width:13px; height:13px; }
  #refreshBtn.spinning svg{ animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  main{ padding:16px 16px 4px; max-width:560px; margin:0 auto; }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:15px 16px; margin-bottom:11px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    transition:background .5s ease;
  }
  .card.flash{ background:#FBF6E8; }
  .cardLeft{ min-width:0; }
  .fundName{ font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.3;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fundMeta{ font-size:11.5px; color:var(--sub); margin-top:3px;
    font-family:'JetBrains Mono',monospace; }
  .cardRight{ text-align:right; flex-shrink:0; }
  .nav{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:19px; color:var(--ink); }
  .pill{
    display:inline-flex; align-items:center; gap:3px; margin-top:5px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600;
    padding:2px 8px; border-radius:99px;
  }
  .pill.up{ color:var(--mint); background:var(--mint-bg); }
  .pill.down{ color:var(--coral); background:var(--coral-bg); }
  .pill.flat{ color:var(--sub); background:#EEF1F5; }

  .skel{ opacity:.55; }
  .skel .nav{ background:#E4E7EC; color:transparent; border-radius:6px; }
  .skel .pill{ background:#EEF1F5; color:transparent; }

  .errCard{
    border:1px dashed #E7B4AC; background:#FDF3F1; color:var(--coral);
    font-size:12.5px; padding:12px 14px; border-radius:14px; text-align:center;
  }

  footer{
    text-align:center; color:var(--sub); font-size:11px; padding:18px 20px 0;
    font-family:'JetBrains Mono',monospace; letter-spacing:.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .dot, #refreshBtn.spinning svg { animation:none; }
    .card{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Amitayu &amp; Mou · Live NAV</p>
  <h1>NAV Tracker</h1>
  <div class="statusRow">
    <div class="live"><span class="dot"></span><span id="statusText">Loading…</span></div>
    <button id="refreshBtn" onclick="loadAll(true)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg>
      Refresh
    </button>
  </div>
</header>

<main id="cards"></main>
<footer id="foot">source: mfnav.in via Google Apps Script · latest NAV</footer>

<script>
const FUNDS = [
  { code:"147946", name:"Bandhan Small Cap Fund",              source:"mfnav" },
  { code:"119132", name:"HDFC Gold ETF Fund of Fund - Direct", source:"mfnav" },
  { code:"145137", name:"Invesco India Smallcap Fund",         source:"mfnav" },
  { code:"150584", name:"WhiteOak Capital Mid Cap Fund",       source:"mfnav" },
  { code:"154215", name:"Abakkus Small Cap Fund - Direct",     source:"mfnav" },
  { code:"147622", name:"Motilal Oswal Nifty Midcap 150 ETF",  source:"mfnav" },
  { code:"147623", name:"Motilal Oswal Nifty Smallcap 250 ETF",source:"mfnav" },
  { code:"153326", name:"Helios Mid Cap Fund - Direct",        source:"mfnav" },
  { code:"152939", name:"TRUSTMF Small Cap Fund - Direct",     source:"mfnav" },
  { code:"154210", name:"TRUSTMF Mid Cap Fund - Direct",       source:"mfnav" }
];

const cardsEl = document.getElementById('cards');
const statusEl = document.getElementById('statusText');
const btnEl = document.getElementById('refreshBtn');

function skeletonRow(f){
  return `<div class="card skel" id="card-${f.code}">
    <div class="cardLeft">
      <div class="fundName">${f.name}</div>
      <div class="fundMeta">loading…</div>
    </div>
    <div class="cardRight">
      <div class="nav">000.00</div>
      <div class="pill flat">— —</div>
    </div>
  </div>`;
}

function render(){
  cardsEl.innerHTML = FUNDS.map(skeletonRow).join('');
}

// Accepts "DD-MM-YYYY" (mfapi.in's format) and returns a sortable timestamp.
// Also tolerates "YYYY-MM-DD" defensively, in case a future source uses it.
function parseAnyDate(s){
  const parts = s.split('-').map(Number);
  const [a,b,c] = parts;
  return a > 31 ? new Date(a, b-1, c).getTime()   // YYYY-MM-DD
                : new Date(c, b-1, a).getTime();  // DD-MM-YYYY
}

// ============================================================
//  PASTE YOUR WEB APP URL BELOW  (from: Deploy > New deployment
//  > Web app, in your portfolio sheet's Apps Script / code.gs v12)
//  It must end in /exec  -- test it in a browser:
//     <your-url>?code=152939   should return JSON with data[].
// ============================================================
const NAV_API = "https://script.google.com/macros/s/AKfycbx2f5pZkTOBP6mUMmiFCkNrKRYBrv8gqrvH1Ob2LfbPaL5wsA19W3Ai6aQKApJ-jLMt/exec";

const NAV_URL = (code) =>
  NAV_API + "?code=" + encodeURIComponent(code) + "&_ts=" + Date.now();


function rowsFromMfnav(json){
  return (json.data || []).map(r => ({
    date: r.nav_date,
    nav: Number(r.nav),
    dayChangePct: Number(r.day_change_pct)
  }));
}

function latestOf(rows){
  // Normally mfnav already returns newest first. Sorting defensively ensures
  // the newest NAV is selected even if the API order changes in the future.
  return rows.slice().sort((a,b)=>parseAnyDate(b.date)-parseAnyDate(a.date));
}

async function fetchJsonWithFallback(urls){
  let lastErr;
  for(const url of urls){
    try{
      const res = await fetch(url, { cache:'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch(e){ lastErr = e; }   // try the next candidate URL
  }
  throw lastErr || new Error('all sources failed');
}

async function fetchFund(f){
  // All NAV data comes from mfnav.in through the tested Apps Script Web App.
  const json = await fetchJsonWithFallback([ NAV_URL(f.code) ]);

  if(!json.success){
    throw new Error(json.error || 'NAV API failed');
  }

  const rows = latestOf(rowsFromMfnav(json));
  if(rows.length === 0) throw new Error('no NAV data returned');

  const today = rows[0];
  const prev = rows[1];

  const nav = today.nav;
  const pnav = prev ? prev.nav : null;
  const chg = pnav != null ? nav - pnav : null;
  const pct = pnav != null && pnav !== 0 ? (chg / pnav) * 100 : null;

  return { ...f, nav, date: today.date, chg, pct };
}

function formatDate(s){
  const d = new Date(parseAnyDate(s));
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function paintCard(data, isRefresh){
  const el = document.getElementById('card-' + data.code);
  if(!el) return;
  const dir = data.chg == null ? 'flat' : (data.chg >= 0 ? 'up' : 'down');
  const arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '—';
  const chgTxt = data.chg == null ? 'first read'
    : `${arrow} ${Math.abs(data.chg).toFixed(2)} (${Math.abs(data.pct).toFixed(2)}%)`;

  el.classList.remove('skel');
  el.innerHTML = `
    <div class="cardLeft">
      <div class="fundName">${data.name}</div>
      <div class="fundMeta">${formatDate(data.date)}</div>
    </div>
    <div class="cardRight">
      <div class="nav">₹${data.nav.toFixed(4)}</div>
      <div class="pill ${dir}">${chgTxt}</div>
    </div>`;

  if(isRefresh){
    el.classList.add('flash');
    setTimeout(()=>el.classList.remove('flash'), 650);
  }
}

function paintError(f){
  const el = document.getElementById('card-' + f.code);
  if(!el) return;
  el.classList.remove('skel');
  el.outerHTML = `<div class="errCard" id="card-${f.code}">${f.name} — couldn't load. <span onclick="retryOne('${f.code}')" style="text-decoration:underline;cursor:pointer;">Retry</span></div>`;
}

async function retryOne(code){
  const f = FUNDS.find(x=>x.code===code);
  const el = document.getElementById('card-'+code);
  if(el) el.outerHTML = skeletonRow(f);
  try{ paintCard(await fetchFundResilient(f), true); } catch(e){ paintError(f); }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

// One retry with a short backoff before giving up on a fund.
async function fetchFundResilient(f){
  try { return await fetchFund(f); }
  catch(e){
    await sleep(500 + Math.random()*400);
    return await fetchFund(f);       // let this one throw if it fails again
  }
}

async function loadAll(isRefresh){
  if(isRefresh){
    btnEl.classList.add('spinning');
    statusEl.textContent = 'Refreshing…';
  } else {
    render();
    statusEl.textContent = 'Loading…';
  }

  const results = [];
  for(let i = 0; i < FUNDS.length; i++){
    const f = FUNDS[i];
    try{
      const value = await fetchFundResilient(f);
      results.push({status:'fulfilled', value});
      paintCard(value, isRefresh);
    } catch(e){
      results.push({status:'rejected', reason:e});
      paintError(f);
    }
    await sleep(200);
  }

  const ok = results.filter(r=>r.status==='fulfilled').length;
  const now = new Date();
  statusEl.textContent = `Updated ${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} · ${ok}/${FUNDS.length} latest NAVs loaded`;
  btnEl.classList.remove('spinning');
}

loadAll(false);
</script>
</body>
</html>
